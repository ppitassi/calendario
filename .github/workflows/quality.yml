name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify

  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ vars.UI_TEST_BASE_URL != '' }}
    env:
      TEST_BASE_URL: ${{ vars.UI_TEST_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ui:browser
      - run: npm run test:ui:responsive
